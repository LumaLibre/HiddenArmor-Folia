name: HiddenArmor
version: '${project.version}'
main: me.kteq.hiddenarmor.HiddenArmor
api-version: 1.16
authors: [ Kteq ]
description: Let players hide their armor and show off their skins
depend: [ProtocolLib]
folia-supported: true
commands:
  hiddenarmor:
    description: "Main Hidden Armor command."
    aliases: [ha, armor]
    usage: "/hiddenarmor <toggle|hide|show> [slot] [player]"
  togglearmor:
    description: "Toggles the visibility of the whole armor or of a single slot."
    usage: "/togglearmor [slot] [player]"